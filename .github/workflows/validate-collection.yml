name: Validate collection

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require updated roadmap for source and packaging PRs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(suite/|addons/|scripts/|config/|sources\.lock\.json$|\.github/workflows/)'; then
            if ! printf '%s\n' "$changed" | grep -Fxq 'ROADMAP.md'; then
              echo '::error::Update ROADMAP.md with the approved changes and next task.'
              exit 1
            fi
          fi
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
      - name: Validate source config
        run: python3 -m json.tool config/addons.json > /dev/null
      - name: Run offline import tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check installable ZIP when addon snapshots exist
        run: |
          if [[ -f sources.lock.json ]]; then
            python3 scripts/build_bundle.py v2.0.0-alpha.1 dist
          else
            echo 'No approved source snapshots yet; skipping ZIP build.'
          fi

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Validate Lua 5.1 syntax and suite toggles
        run: |
          set -euo pipefail
          luac5.1 -p suite/NCore/Core.lua suite/NCore/Settings.lua suite/NCore/LegacyCheck.lua
          lua5.1 scripts/test_suite_core.lua
          lua5.1 scripts/test_suite_settings.lua
          lua5.1 scripts/test_suite_legacy.lua
          python3 - <<'PY'
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path
          archive = Path('dist/N-Addon-Collection-v2.0.0-alpha.1.zip')
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(archive) as z:
                  source = z.read('NCore/ClassicBattlegrounds/NClassicBattlegrounds.lua')
              path = Path(tmp) / 'NClassicBattlegrounds.lua'
              path.write_bytes(source)
              subprocess.run(['luac5.1', '-p', str(path)], check=True)
          print('Embedded Battlegrounds syntax is valid in Lua 5.1')
          PY
      - name: Upload test suite ZIP (not a public release)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: n-addon-suite-v2-test
          path: dist/N-Addon-Collection-v2.0.0-alpha.1.zip
          if-no-files-found: error
