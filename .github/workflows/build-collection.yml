name: Build or publish addon bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Collection version, e.g. v1.0.0
        required: true
        type: string
      publish_release:
        description: Publish a public GitHub Release after building?
        type: boolean
        required: true
        default: false
      prerelease:
        description: Mark the GitHub Release as a pre-release?
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and build installable ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Use a version like v1.0.0 or v1.0.0-rc.1'
            exit 1
          fi
          python3 scripts/build_bundle.py "$VERSION" dist
      - name: Save downloadable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-collection-${{ inputs.version }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish only when explicitly requested
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; choose a new version"
            exit 1
          fi
          printf '## Included addon snapshots\n\nSource versions and commit hashes: see sources.lock.json at this release tag.\n\nExtract the addon folders into World of Warcraft/Interface/AddOns/.\n' > release-notes.txt
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then extra+=(--prerelease); fi
          gh release create "$VERSION" "dist/Naxxramas-Addon-Collection-$VERSION.zip" --target "$GITHUB_SHA" --title "Naxxramas Addon Collection $VERSION" --notes-file release-notes.txt "${extra[@]}"
