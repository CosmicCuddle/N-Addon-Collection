name: Build or publish addon bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Collection version, e.g. v1.0.0
        required: true
        type: string
      publish_release:
        description: Publish a public GitHub Release after building?
        type: boolean
        required: true
        default: false
      prerelease:
        description: Mark the GitHub Release as a pre-release?
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bundle:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: N Addon Collection v1.0.0') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select version and validate
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            VERSION='v1.0.0'
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Use a version like v1.0.0 or v1.0.0-rc.1'
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build install-ready bundle
        run: python3 scripts/build_bundle.py "$VERSION" dist
      - name: Save downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-collection-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish only when expressly requested
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; choose a new version"
            exit 1
          fi
          python3 - <<'PY' > release-notes.txt
          import json
          from pathlib import Path
          lock = json.loads(Path('sources.lock.json').read_text())
          print('## Included addon versions\n')
          for addon, details in sorted(lock.items()):
              print(f"- **{addon} v{details['version'].removeprefix('v')}** — {details['repository']} at `{details['commit'][:12]}`")
          print('\n## Installation\n')
          print('Back up existing addon folders and `WTF` SavedVariables first.')
          print('Extract the ZIP directly into `World of Warcraft/Interface/AddOns/` (no extra collection folder).')
          print('\n## Testing status\n')
          print('**N Loot Ledger (v0.1.0.27) is a work in progress and is not fully complete.**')
          print('Some features, including real Master Loot awarding, still require controlled in-game and server testing.')
          print('The collection itself is a standard release; inclusion does not mean every individual addon is feature-complete.')
          print('N Classic Battlegrounds v1.0.0 has further progression-transition and optional server-side rules testing outstanding.')
          print('MultiBot bridge and Naxxramas server features require the corresponding server modules.')
          PY
          extra=()
          if [[ "$PRERELEASE" == 'true' ]]; then extra+=(--prerelease); fi
          gh release create "$VERSION" "dist/N-Addon-Collection-$VERSION.zip" --target "$GITHUB_SHA" --title "N Addon Collection $VERSION" --notes-file release-notes.txt "${extra[@]}"
