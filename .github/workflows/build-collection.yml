name: Build or publish addon bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Collection version, e.g. v1.0.0
        required: true
        type: string
      publish_release:
        description: Publish a public GitHub Release after building?
        type: boolean
        required: true
        default: false
      prerelease:
        description: Mark the GitHub Release as a pre-release?
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bundle:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: N Addon Collection v2.0.0') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select version and validate
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            VERSION='v2.0.0'
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Use a version like v1.0.0 or v1.0.0-rc.1'
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build install-ready bundle
        run: python3 scripts/build_bundle.py "$VERSION" dist
      - name: Verify v2 package has no Talent Calculator
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          archive = Path('dist') / f"N-Addon-Collection-{__import__('os').environ['VERSION']}.zip"
          with zipfile.ZipFile(archive) as pack:
              names = pack.namelist()
              roots = {name.partition('/')[0] for name in names}
              approved = {'NCore','IndividualProgressionAddon','DungeonJournal','MultiBot','NaxxLootLottery'}
              assert roots == approved, f'Unexpected installed addon folders: {roots ^ approved}'
              assert 'NCore/ClassicBattlegrounds/NClassicBattlegrounds.lua' in names
              assert 'NTalentCalculator' not in roots
              assert 'NClassicBattlegrounds' not in roots
              assert '## Version: 2.0.0' in pack.read('NCore/NCore.toc').decode('utf-8')
          lock = json.loads(Path('sources.lock.json').read_text())
          assert 'NTalentCalculator' not in lock
          print('Verified v2: required NCore, four optional folders, no Talent Calculator')
          PY
      - name: Save downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-collection-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish only when expressly requested
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; choose a new version"
            exit 1
          fi
          python3 - <<'PY' > release-notes.txt
          import json
          from pathlib import Path
          lock = json.loads(Path('sources.lock.json').read_text())
          print('## N Addon Suite v2.0.0')
          print('')
          print('Standard release for WoW 3.3.5a. One downloadable suite managed through NCore.')
          print('')
          print('### Installed folders (exactly five)')
          print('')
          print('- **NCore** — required suite framework, settings, compatibility warnings and mandatory N Classic Battlegrounds')
          print('- **IndividualProgressionAddon** — optional Individual Progression Companion')
          print('- **DungeonJournal** — optional Dungeon Journal')
          print('- **MultiBot** — optional MultiBot Chatless')
          print('- **NaxxLootLottery** — optional N Loot Ledger (work in progress)')
          print('')
          print('**N Talent Calculator is NOT included** in this release. It continues as a separate addon in development.')
          print('N Classic Battlegrounds is built into NCore and has no standalone folder or separate toggle.')
          print('')
          print('### Approved original addon sources')
          for addon, details in sorted(lock.items()):
              print(f"- **{addon} v{details['version'].removeprefix('v')}** — {details['repository']} at `{details['commit'][:12]}`")
          print('')
          print('### Installation / upgrading from v1.0.0')
          print('1. Close WoW. Back up all five existing addon folders and `WTF` SavedVariables.')
          print('2. Remove the previous standalone `NClassicBattlegrounds` addon folder to avoid duplicate PvP hooks.')
          print('3. If present, remove the older `ServerDungeonJournal` folder to avoid a duplicate `/dj` addon.')
          print('4. Extract the release ZIP into `World of Warcraft/Interface/AddOns/`; do not nest an outer collection folder.')
          print('5. Open `/nsettings` or `/nsuite` to configure four optional modules. After changes, use Reload UI.')
          print('6. Optional diagnostic: `/nsuite check` scans known registered legacy addon folders.')
          print('')
          print('### Testing and compatibility notes')
          print('- **N Loot Ledger (v0.1.0.27) remains WIP.** Real Master Loot awarding is not yet fully tested.')
          print('- Classic Battlegrounds UI restrictions are client-side only; server-side queue restrictions need separate enforcement.')
          print('- MultiBot bridge and specific Naxxramas systems require matching server modules.')
          print('- Optional addon toggles apply after a UI reload, not by unloading Lua during gameplay.')
          print('- Keep the [v1.0.0 release](https://github.com/CosmicCuddle/N-Addon-Collection/releases/tag/v1.0.0) as a rollback.')
          PY
          extra=()
          if [[ "$PRERELEASE" == 'true' ]]; then extra+=(--prerelease); fi
          gh release create "$VERSION" "dist/N-Addon-Collection-$VERSION.zip" --target "$GITHUB_SHA" --title "N Addon Collection $VERSION" --notes-file release-notes.txt "${extra[@]}"
